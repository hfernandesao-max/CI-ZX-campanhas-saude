<title>Mito ou Verdade</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: um ecrã de cada vez, centrado, como uma keynote — funciona no telemóvel e projectado */
:root {
  --bg: #000000;
  --surface: #1C1C1E;
  --fg: #F5F5F7;
  --muted: #A1A1A6;
  --faint: #8E8E93;
  --pink: #FF4F96;
  --blue: #5A96FF;
  --violet: #B06BFF;
  --ok: #FF4F96;
  --display: "Inter", -apple-system, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--display);
  -webkit-font-smoothing: antialiased;
}
.app {
  min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column;
  padding-block: 24px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1100px; margin: 0 auto;
}
.top { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 44px; }
.eyebrow { font-size: clamp(12px, 1.6vw, 16px); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--pink); }
.selo { height: clamp(32px, 4.5vw, 48px); width: auto; display: block; }
.stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: clamp(20px, 3.5vw, 36px); padding-block: 24px; }
.grad { background: linear-gradient(90deg, var(--pink) 0%, var(--violet) 55%, var(--blue) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
h1 { margin: 0; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; text-wrap: balance; }
.title-xl { font-size: clamp(48px, 11vw, 140px); }
.statement { font-size: clamp(32px, 6.4vw, 88px); max-width: 18ch; }
.verdict { font-size: clamp(72px, 16vw, 200px); }
.lead { margin: 0; font-size: clamp(18px, 2.6vw, 30px); line-height: 1.4; color: var(--muted); max-width: 34ch; text-wrap: balance; }
.expl { margin: 0; font-size: clamp(20px, 3vw, 36px); line-height: 1.38; font-weight: 500; max-width: 30ch; text-wrap: balance; }
.quote { margin: 0; font-size: clamp(16px, 2.2vw, 26px); color: var(--muted); max-width: 40ch; }
.tag { font-size: clamp(16px, 2.2vw, 24px); font-weight: 700; padding: 8px 18px; border-radius: 999px; }
.tag.right { background: var(--pink); color: #000; }
.tag.wrong { background: var(--surface); color: var(--fg); }
.choices { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; width: 100%; }
button { font: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }
.choice {
  min-width: min(240px, 42vw); min-height: 64px; padding: 16px 40px; border-radius: 999px;
  font-size: clamp(22px, 3vw, 34px); font-weight: 700; transition: transform .15s ease, background .15s ease;
}
.choice.v { background: var(--pink); color: #000; }
.choice.m { background: transparent; color: var(--fg); box-shadow: inset 0 0 0 3px var(--fg); }
.choice:hover { transform: translateY(-2px); }
.next {
  min-height: 52px; padding: 14px 32px; border-radius: 999px; background: var(--fg); color: #000;
  font-size: clamp(18px, 2.2vw, 24px); font-weight: 600;
}
.next.ghost { background: var(--surface); color: var(--fg); }
.bottom { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; min-height: 52px; }
.source { font-size: 14px; color: var(--faint); }
.dots { display: flex; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #3A3A3C; }
.dot.on { background: var(--fg); }
.choice { display: inline-flex; align-items: center; justify-content: center; cursor: default; }
.choice:hover, .opt:hover { transform: none; }
.opt { cursor: default; }
.opt:hover { background: var(--surface); }
.hint { margin: 0; font-size: clamp(14px, 1.8vw, 20px); color: var(--faint); }
.tools { display: flex; align-items: center; gap: 16px; }
.fsbtn { width: 44px; height: 44px; border-radius: 50%; background: var(--surface); color: var(--fg); display: grid; place-items: center; }
.statement.mcq { font-size: clamp(26px, 4.4vw, 60px); max-width: 24ch; }
.verdict-mc { font-size: clamp(32px, 5.6vw, 72px); max-width: 22ch; }
.opts { display: grid; gap: 12px; width: 100%; max-width: 760px; }
.opt {
  display: flex; align-items: center; gap: 16px; text-align: left; min-height: 64px; padding: 14px 20px;
  border-radius: 20px; background: var(--surface); color: var(--fg); font-size: clamp(18px, 2.4vw, 28px); font-weight: 600;
  transition: background .15s ease;
}
.opt:hover { background: #2C2C2E; }
.opt span:last-child { min-width: 0; }
.letter {
  flex-shrink: 0; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  background: var(--fg); color: #000; font-size: 18px; font-weight: 800;
}
.ribbon { height: clamp(120px, 20vw, 200px); width: auto; display: block; }
.score { font-size: clamp(96px, 20vw, 220px); font-variant-numeric: tabular-nums; }
.fade { animation: in .5s ease both; }
@keyframes in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade { animation: none; } .choice { transition: none; } }
</style>

  var stage = document.getElementById("stage");
  var eyebrow = document.getElementById("eyebrow");
  var dots = document.getElementById("dots");
  var i = 0, score = 0;

  function esc(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
  function drawDots(active) {
    var h = "";
    for (var k = 0; k < Q.length; k++) h += '<span class="dot' + (k <= active ? ' on' : '') + '"></span>';
    dots.innerHTML = active < 0 ? "" : h;
  }
  function show(html, focusSel) {
    stage.classList.remove("fade"); void stage.offsetWidth; stage.classList.add("fade");
    stage.innerHTML = html;
    var f = focusSel && stage.querySelector(focusSel); if (f) f.focus({ preventScroll: true });
  }
  function start() {
    i = 0; score = 0; document.getElementById("source").textContent = ""; question();
  }
  var L = ["A", "B", "C", "D"];
  function question() {
    var q = Q[i];
    eyebrow.textContent = (q.t === "tf" ? "Mito ou Verdade?" : "Escolha a resposta") + " · " + (i + 1) + " / " + Q.length;
    drawDots(i);
    var reveal = '<button class="next ghost" type="button" id="reveal">Ver resposta</button>';
    if (q.t === "tf") {
      show(
        '<h1 class="statement">«' + esc(q.s) + '»</h1>' +
        '<div class="choices">' +
          '<span class="choice v">Verdade</span>' +
          '<span class="choice m">Mito</span>' +
        '</div>' +
        '<p class="hint">Levante o cartão com a sua resposta.</p>' + reveal, "#reveal");
    } else {
      var h = '<h1 class="statement mcq">' + esc(q.s) + '</h1><div class="opts">';
      q.o.forEach(function (o, k) {
        h += '<div class="opt"><span class="letter">' + L[k] + '</span><span>' + esc(o) + '</span></div>';
      });
      show(h + '</div>' + '<p class="hint">Diga a letra em voz alta ou levante a mão.</p>' + reveal, "#reveal");
    }
    document.getElementById("reveal").addEventListener("click", answer);
  }
  function answer() {
    var q = Q[i];
    eyebrow.textContent = "Resposta · " + (i + 1) + " / " + Q.length;
    document.getElementById("source").textContent = "Fonte: " + q.src;
    var last = i === Q.length - 1;
    var verdict = q.t === "tf" ? (q.a ? 'Verdade.' : 'Mito.') : (L[q.a] + '. ' + esc(q.o[q.a]));
    show(
      '<p class="quote">' + (q.t === "tf" ? '«' + esc(q.s) + '»' : esc(q.s)) + '</p>' +
      '<h1 class="grad ' + (q.t === "tf" ? 'verdict' : 'verdict-mc') + '">' + verdict + '</h1>' +
      '<p class="expl">' + esc(q.e) + '</p>' +
      '<button class="next" type="button" id="go">' + (last ? 'Terminar' : 'Pergunta seguinte') + '</button>', "#go");
    document.getElementById("go").addEventListener("click", function () {
      if (last) result(); else { i++; question(); }
    });
  }
  function result() {
    eyebrow.textContent = "Outubro Rosa";
    drawDots(-1);
    document.getElementById("source").textContent = "Fontes: OMS, IARC e American Cancer Society";
    show(
      '<img class="ribbon" src="' + LACO + '" alt="" aria-hidden="true">' +
      '<h1 class="grad title-xl">Obrigada!</h1>' +
      '<p class="expl">Segue-se agora um pequeno lanche convívio.</p>' +
      '<p class="lead">Aproveite para conversar e partilhar o que aprendeu com as suas colegas.</p>' +
      '<p class="quote">Conheça-se. Previna-se. Partilhe.</p>' +
      '<button class="next ghost" type="button" id="again">Voltar ao início</button>', "#again");
    document.getElementById("again").addEventListener("click", start);
  }
  document.getElementById("start").addEventListener("click", start);
  /* Avançar com o teclado ou com um apresentador sem fios (seta, espaço, PageDown) */
  document.addEventListener("keydown", function (ev) {
    var keys = ["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"];
    if (keys.indexOf(ev.key) < 0) return;
    var b = stage.querySelector("button.next");
    if (b) { ev.preventDefault(); b.click(); }
  });
  var fs = document.getElementById("fs");
  fs.addEventListener("click", function () {
    var el = document.documentElement;
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
    } catch (e) {}
  });
})();
</script>
