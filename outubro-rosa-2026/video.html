<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Vídeo · Outubro Rosa</title>
<link rel="icon" href="../assets/laco.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root { --bg:#000; --surface:#161618; --fg:#F5F5F7; --muted:#A1A1A6; --blue:#5A96FF; color-scheme: dark;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin:0; background:var(--bg); color:var(--fg); font-family:var(--font); -webkit-font-smoothing:antialiased; }
.page { max-width: 1280px; margin: 0 auto; min-height: 100dvh; display:flex; flex-direction:column; gap: 28px;
  padding-block: max(24px, env(safe-area-inset-top)) max(32px, env(safe-area-inset-bottom));
  padding-left: max(20px, env(safe-area-inset-left)); padding-right: max(20px, env(safe-area-inset-right)); }
.bar { display:flex; justify-content:space-between; align-items:center; gap:16px; }
.back { display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:10px 18px 10px 12px; border-radius:999px;
  background:var(--surface); color:var(--fg); text-decoration:none; font-weight:600; font-size:16px; }
.back svg { width:18px; height:18px; }
.back:focus-visible { outline:3px solid var(--blue); outline-offset:3px; }
.selo { height:44px; width:auto; }
.player { flex:1; display:flex; align-items:center; justify-content:center; }
video { width:100%; max-height: 68vh; border-radius: 24px; background:#000; box-shadow: 0 40px 80px -30px rgba(255,79,150,.35); }
h1 { margin:0; font-size: clamp(28px, 4vw, 44px); font-weight:800; letter-spacing:-0.03em; }
p { margin: 6px 0 0; color: var(--muted); font-size: 17px; }
</style>
</head>
<body>
<main class="page">
  <div class="bar">
    <a class="back" href="../">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      Início
    </a>
    <img class="selo" src="../assets/selo.png" alt="ConsultIT e Zentrix">
  </div>
  <div class="player">
    <video controls playsinline preload="metadata" poster="poster.jpg" src="video.mp4">
      O seu navegador não consegue reproduzir este vídeo.
    </video>
  </div>
  <div>
    <h1>Outubro Rosa 2026</h1>
    <p>Prevenção e detecção precoce do cancro da mama · ConsultIT e Zentrix</p>
  </div>
</main>
</body>
</html>
